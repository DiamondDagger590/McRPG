name: Claude PR Review

# Consolidated AI PR review. A single orchestrator run (claude-code-action) fans
# out to one persona subagent per review lens, then posts ONE sticky comment.
# Replaces the old pr-review.yml + ai-persona-review.yml pipeline, which posted a
# fresh top-level comment per persona on every push.
on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [master, develop, recode]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

env:
  # Single model knob. Sonnet 5 carries $2/$10-per-MTok intro pricing through
  # 2026-08-31 (then $3/$15, and ~30% more tokens per request than the 4.6
  # tokenizer) — revisit the model/cost tradeoff before September 2026.
  CLAUDE_MODEL: claude-sonnet-5

permissions:
  contents: read          # bump to write only if @claude should ever push fix commits
  pull-requests: write
  issues: write

jobs:
  # One automated review when a PR opens non-draft or leaves draft. No per-push
  # reviews — re-review on demand with an @claude comment.
  auto-review:
    # Don't cancel an in-flight review when a second PR lifecycle event
    # races (opened + ready_for_review can fire simultaneously).
    concurrency:
      group: claude-review-auto-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.title, '[skip-review]') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pin review-steering files to the base branch so a PR cannot weaken
      # its own review by modifying the orchestration prompt, agent defs, or
      # the command checklists the agents delegate to.
      # rm -rf first so PR-added files absent from the base branch are removed.
      - name: Pin review config to base branch
        run: |
          rm -rf .github/claude-review-prompt.md .claude/agents/ .claude/commands/
          git checkout "${{ github.event.pull_request.base.sha }}" -- \
            .github/claude-review-prompt.md .claude/agents/ .claude/commands/ 2>/dev/null || true
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Reuse the ambient token (as the old pipeline did); comments post as
          # github-actions[bot]. No Claude GitHub App install required.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # REQUIRED alongside a custom prompt, or the sticky comment silently
          # never posts (anthropics/claude-code-action#1108).
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is the initial automated review of this PR. Read
            .github/claude-review-prompt.md in this checkout and execute the
            orchestrated review protocol it defines.
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns 40
            --allowedTools "Agent,Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"

  # On-demand: an @claude mention in a PR comment or review comment. Tag mode
  # (no prompt) — claude-code-action handles the sticky comment natively here.
  on-demand:
    # A new @claude mention on the same PR cancels the previous on-demand run.
    concurrency:
      group: claude-review-ondemand-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    if: >-
      ((github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude')) ||
       (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude'))) &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.issue.number || github.event.pull_request.number }}/head
      - name: Reject fork PRs
        id: fork-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          IS_FORK="$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json isCrossRepository -q '.isCrossRepository')"
          echo "is_fork=$IS_FORK" >> "$GITHUB_OUTPUT"
      # Pin review-steering files to the base branch so a PR cannot weaken
      # its own review by modifying the orchestration prompt, agent defs, or
      # the command checklists the agents delegate to.
      # rm -rf first so PR-added files absent from the base branch are removed.
      - name: Pin review config to base branch
        if: steps.fork-check.outputs.is_fork != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          BASE_SHA="$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json baseRefOid -q '.baseRefOid')"
          rm -rf .github/claude-review-prompt.md .claude/agents/ .claude/commands/
          git checkout "$BASE_SHA" -- .github/claude-review-prompt.md .claude/agents/ .claude/commands/ 2>/dev/null || true
      - uses: anthropics/claude-code-action@v1
        if: steps.fork-check.outputs.is_fork != 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns 40
            --allowedTools "Agent,Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "If asked to review or re-review this PR, follow .github/claude-review-prompt.md including its re-review convergence protocol. Otherwise answer the request directly."
