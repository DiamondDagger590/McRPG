# Quest-specific localization file.
# This file contains locale strings for quest reward display labels and other
# quest content that does not belong in the command, GUI, or general locale files.
#
# -----------------------------------------------------------------------
# HOW REWARD DISPLAY LABELS WORK
# -----------------------------------------------------------------------
#
# Every reward shown in the quest GUI goes through a four-step resolution:
#
#   1. Per-quest locale entry (most specific, highest priority)
#      Add an entry at the auto-derived route in this file (or any locale
#      override file for another language). Format:
#
#        quests.<namespace>.<quest_key>.rewards.<reward_label>
#        e.g.  quests.mcrpg.daily_ore_rush.rewards.hero_title: "Hero Title"
#
#      Other supported route patterns:
#        quests.<namespace>.<quest_key>.objectives.<obj_key>.rewards.<label>
#        quests.<namespace>.<quest_key>.stages.<stage_key>.rewards.<label>
#        templates.<namespace>.<template_key>.rewards.<label>
#
#   2. Inline display.rewards label from the quest YAML (easy per-quest override)
#      In the quest's display: block, add a rewards: sub-section:
#
#        display:
#          name: "Ore Rush"
#          rewards:
#            mining_xp: "<amount> <skill> XP"   # MiniMessage with placeholders
#            gem_bonus:  "<amount>x <material>"
#
#      Placeholders like <amount>, <skill>, <material>, <ability>, <tier> are
#      substituted with the reward's actual config values at display time.
#      This is the EASIEST place to customize a single reward without editing
#      locale files. Every shipped quest YAML includes these entries so you can
#      see and edit them immediately.
#
#   3. Type-level format template (global default for all rewards of that type)
#      Edit the quest-reward-types section below to change the format globally
#      across every quest that uses that reward type.
#
#   4. Hard-coded English fallback (should never be reached for built-in types)
#
# -----------------------------------------------------------------------
# QUICK REFERENCE — placeholders per reward type
# -----------------------------------------------------------------------
#
#   mcrpg:experience         <amount>  <skill>
#   mcrpg:item               <amount>  <material>
#   mcrpg:ability_upgrade    <ability> <tier>
#   mcrpg:ability_upgrade_next_tier  <ability>
#   mcrpg:command            (no data placeholders — use a literal label)
#   mcrpg:scalable_command   (no data placeholders for the main label)
#
# -----------------------------------------------------------------------
# EXAMPLE — customizing a single reward per-quest
# -----------------------------------------------------------------------
#
#   In the quest YAML:
#     display:
#       name: "Ore Rush"
#       rewards:
#         mining_xp: "<gold><amount> <skill> XP"   # override with gold color
#         gem_bonus:  "Rare Diamond"                # literal label
#
#   In this file (global locale override for all players):
#     quests:
#       mcrpg:
#         daily_ore_rush:
#           rewards:
#             mining_xp: "<gold><amount> Mining XP"
#
# All display strings use MiniMessage syntax for styling (e.g. <gold>, <bold>).
# Note: {player} / {amount} inside reward 'commands' entries are Bukkit dispatch
# substitutions — those use {} braces and are NOT localization placeholders.
#
locale: en
config-version: 1

