# -----------------------------------------------------------------------
# REWARD TYPE FORMAT TEMPLATES
# -----------------------------------------------------------------------
# These entries control how each built-in reward type is displayed in
# quest GUIs. Edit them here to change the format globally across all
# quests, or override per-reward in the quest YAML's display.rewards block.
#
# All values use MiniMessage syntax for styling (e.g. <gold>, <bold>).
# Available placeholders vary by type — see comments on each entry.
#
# Quickest way to customize a single reward:
#   In the quest YAML, set display.rewards.<label> to any string.
#   Example: swords_xp: "<gold><amount> Swords XP"
#
# To change the format for ALL rewards of a type at once, edit the
# 'format' value below.
# -----------------------------------------------------------------------
quest-reward-types:

  # Default MiniMessage color/style prepended to every reward display label before it is
  # shown in a GUI. It applies regardless of whether the label came from a locale entry,
  # a per-type format template, or a per-quest inline display.rewards value.
  #
  # Any explicit color tag inside a template or inline label automatically overrides this
  # default because of MiniMessage stream ordering — the later tag wins.
  #
  # Examples:
  #   default-color: "<primary>"     # palette primary color (shipped default)
  #   default-color: "<#ffaa00>"    # custom hex colour
  #   default-color: ""             # no default; only template-level colours apply
  default-color: "<primary>"

  # mcrpg:experience — grants McRPG skill XP to the completing player.
  # Placeholders:
  #   <amount> — the XP amount configured on the reward (e.g. 1500)
  #   <skill>  — formatted skill name derived from the 'skill' config key
  #              (e.g. "SWORDS" becomes "Swords", "mcrpg:mining" becomes "Mining")
  experience:
    format: "<amount> <skill> XP"

  # mcrpg:command — executes one or more console commands on completion.
  # No inherent runtime data to use as placeholders, so a fixed fallback
  # is used when no per-quest locale entry or display.rewards label is set.
  command:
    fallback-display: "Special Reward"

  # mcrpg:scalable_command — like mcrpg:command but supports an {amount}
  # token in the command that scales with rarity reward-multiplier.
  # Placeholders for amount-suffix:
  #   <amount> — the scaled numeric amount at grant time
  scalable-command:
    fallback-display: "Scaled Reward"
    amount-suffix: " (x<amount>)"

  # mcrpg:item — grants an ItemStack directly to the player's inventory.
  # Placeholders:
  #   <amount>   — number of items granted (the top-level 'amount' key)
  #   <material> — formatted material name derived from the item's
  #                'material' config key (e.g. "DIAMOND_PICKAXE" becomes
  #                "Diamond Pickaxe")
  item:
    format: "<amount>x <material>"

  # mcrpg:ability_upgrade — upgrades a specific ability to a fixed tier.
  # Placeholders:
  #   <ability> — formatted ability name derived from the 'ability' key
  #               (e.g. "mcrpg:bleed" becomes "Bleed")
  #   <tier>    — the target tier number configured on the reward
  ability-upgrade:
    format: "<body>Upgrade: <ability> <body>(Tier <primary><tier><body>)"

  # mcrpg:ability_upgrade_next_tier — upgrades an ability to whatever
  # its next unlocked tier is at grant time.
  # Placeholders:
  #   <ability> — formatted ability name (same derivation as above)
  ability-upgrade-next-tier:
    format: "<body>Upgrade: <ability> <body>(Next Tier)"

  # mcrpg:message — sends a message to the player.
  # No placeholders — used as a fallback description label in GUI when no
  # locale key or inline messages are configured.
  message:
    format: "<body>Message"

  # mcrpg:boosted_experience — grants boosted XP pool points.
  # Placeholders:
  #   <amount> — the amount of boosted experience granted
  boosted-experience:
    format: "<body><amount> <primary>Boosted XP"

  # mcrpg:redeemable_experience — grants redeemable XP pool points.
  # Placeholders:
  #   <amount> — the amount of redeemable experience granted
  redeemable-experience:
    format: "<body><amount> <primary>Redeemable XP"

  # mcrpg:redeemable_levels — grants redeemable level points.
  # Placeholders:
  #   <amount> — the number of redeemable levels granted
  redeemable-levels:
    format: "<body><amount> <primary>Redeemable Level(s)"

