quest-chain:
  events:
    # Placeholders: <chain> = chain display name
    chain-start: "<primary><chain> <body>quest chain started!"
    # Placeholders: <chain> = chain display name, <step> = 1-based step number, <total> = total step count
    chain-advance: "<body>Quest chain <primary><chain> <body>advanced to step <primary><step>/<total>"
    # Placeholders: <chain> = chain display name
    chain-complete: "<positive>Congratulations! <body>You've completed the <primary><chain> <body>quest chain!"
  cascade:
    # Placeholders: <chain> = chain display name
    batch-header: "<primary><chain>: <body>You've already completed these steps!"
    # Placeholders: <quest> = quest display name
    batch-step-entry: "<body>  \u2713 <primary><quest>"
  admin:
    skip:
      # Placeholders: <player> = player name, <chain_name> = chain display name, <chain_key> = chain key, <count> = steps skipped
      success: "<positive>Skipped <primary><player><body>'s chain <primary><chain_name><body> \u2014 <primary><count><body> remaining steps completed with rewards."
      error-no-state: "<negative>Player has no active state for chain '<primary><chain_key><body>'."
      error-terminal: "<negative>Player's chain '<primary><chain_key><body>' is in state <primary><chain_state><body>. Use reset first."
  preview:
    # Placeholders: <step_number> = 1-based step index
    locked-title: "<negative>Step <step_number> — Locked"
    locked-description: "<body>This step is not yet available."
    # Placeholders: <step_number> = 1-based step index, <quest_name> = display name
    step-title: "<primary>Step <step_number>: <body><quest_name>"
