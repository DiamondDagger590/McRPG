#######################################
#
# English localization for McRPG abilities.
# This file is part of the English (en) locale.
#
# Color Palette
# This file uses semantic color placeholders that resolve to MiniMessage values
# configured in config.yml's palette section. Available placeholders:
#
#   <primary>         Warm Amber (#D4A76A)  -- titles, nav items, stat values
#   <hint>            Warm Yellow (#E8C97A) -- click hints, calls-to-action
#   <mana>            Sky Blue (#5EA8FF)    -- mana costs
#   <ability-active>  Coral (#FF7B5E)       -- active ability names/tags
#   <ability-passive> Sage Green (#7FB87F)  -- passive ability names/tags
#   <ability-innate>  Silver (#9E9E9E)      -- innate abilities, disabled states
#   <body>            Gray                  -- body text, labels
#   <positive>        Green                 -- enabled, success
#   <negative>        Red                   -- disabled, error, deny
#   <warning>         Yellow                -- caution, expiration
#
# Server owners can customize all colors in config.yml under the 'palette' section.
# You can also define your own custom color tags there — any key you add becomes
# a usable <placeholder> in this file.
#
#######################################
locale: en
config-version: 1
# Configure ability placeholders, display items and other text/items.
ability:
  # Mana feedback messages sent to the player when an ability cannot be activated.
  mana-feedback:
    # Sent as a chat message when the player does not have enough mana to activate an ability.
    # Placeholders: <ability> (ability name), <cost> (required mana), <current> (current mana)
    insufficient: "<negative>Not enough mana to use <ability><negative>! <body>(need <cost>, have <current>)"
    # Short HUD flash shown on the action bar when the player lacks mana (~3 seconds).
    # Placeholders: <ability> (ability name)
    insufficient-hud: "<negative>Not Enough Mana"
    # Sent as a chat message when the player attempts to activate an ability that is on cooldown.
    # Placeholders: <ability> (ability name), <remaining> (seconds remaining)
    cooldown-active: "<ability> <negative>is on cooldown! <body>(<remaining>s remaining)"
    # Short HUD flash shown on the action bar when an ability is on cooldown (~3 seconds).
    # Placeholders: <ability> (ability name), <remaining> (seconds remaining)
    cooldown-active-hud: "<negative>On Cooldown <body>(<remaining>s)"
  # Configure messages relating to abilities that can be on cooldown
  cooldown:
    # The message to send to the player when they try to use an ability still on cooldown
    # Supports <ability> as a placeholder for the ability on cooldown.
    ability-still-on-cooldown: "<negative><ability> is still on cooldown."
    # The message to send to the player whenever an ability is no longer on cooldown
    # Supports <ability> as a placeholder for the ability that was on cooldown.
    ability-no-longer-on-cooldown: "<ability> <body>is now off cooldown!"
  # Configure messages for when abilities are unlocked
  # Supports <ability> as a placeholder for the ability name
  unlock:
    # The message to send when a player unlocks a new ability
    ability-unlocked: "<positive>You have unlocked a new ability! <ability> <positive>is now available for use."
    # The message to send when an ability is automatically added to the player's loadout
    ability-added-to-loadout: "<positive>The new ability has automatically been added to your current loadout."
    # The message to send when an ability cannot be added because there's already an active ability for that skill
    # Supports <skill> and <ability> placeholders
    ability-not-added-duplicate-skill: "<negative>You already have an active ability for the skill <skill> <negative>in your loadout, so <ability> <negative>was not automatically added."
  # Configure additional lore lines for ability items that will be appended to ability item lore when conditions are met
  lore:
    # Configure ability upgrade quest lore
    # The following placeholders are supported: <ability-points>, <next-tier-ability-points>, <upgrade-quest-progress>
    quest:
      # The lore to add when an ability has an active upgrade quest
      quest-progress:
        - '<body>Upgrade Quest Progress: <upgrade-quest-progress>'
    # The lore to add when the player isn't high enough level to upgrade the ability.
    # The following placeholders are supported: <next-tier-level>, <skill>
    upgrade-locked-behind-levelup:
      - '<body>Upgrade this ability once you reach <primary>Lv <next-tier-level>'
      - '<body>in <primary><skill><body>.'
    ability-locked:
      - '<body>Unlock this ability when your <primary><skill> <body>skill'
      - '<body>reaches level <primary><ability-unlock-level><body>.'
    # The lore to add to show what expansion pack an ability is from (only will be displayed if it isn't from McRPG)
    # The following placeholders are supported: <expansion-pack>
    expansion-pack:
      - '<body>Expansion Pack: <primary><expansion-pack>'
    # Java-injected type tag lore line (shown for every ability)
    type:
      # Shown for ComboActivatable abilities
      active: '<body>Type: <ability-active>Active'
      # Shown for PassiveAbility abilities that require unlocking
      passive: '<body>Type: <ability-passive>Passive'
      # Shown for abilities with no unlock attribute (always present in loadouts)
      innate: '<body>Type: <ability-innate>Innate'
    # Java-injected mana cost line for ManaAbility abilities with cost > 0.
    # Placeholder: <mana-cost> (resolved to the tier-dependent mana cost integer)
    mana-cost-line: '<body>Mana Cost: <mana><mana-cost>'
    # Java-injected toggle status lines (shown when ability has AbilityToggledOffAttribute)
    status:
      enabled: '<body>Status: <positive>Enabled'
      disabled: '<body>Status: <negative>Disabled'
    # Java-injected click hint lines
    hint:
      # Shown when ability is currently disabled (left-click to enable)
      toggle-enable: '<hint>Left-click <body>to enable'
      # Shown when ability is currently enabled (left-click to disable)
      toggle-disable: '<hint>Left-click <body>to disable'
      # Always shown — all abilities have an edit GUI accessible via right-click
      configure: '<hint>Right-click <body>to configure'
      # Shown for Bedrock (Geyser) players instead of separate left/right hints
      configure-bedrock: '<hint>Click <body>to configure'
  ability-specific-localization:
    # Configure localization for the Bleed ability
    bleed:
      display-item:
        # Allows you to configure how this ability's name will be displayed
        name: "<ability-innate><ability></ability-innate>"
        # The name of this ability to be displayed across McRPG
        ability-name: "Bleed"
        material: REDSTONE
        # Supports the following placeholders: <skill>, <activation-chance>
        lore:
          - '<body>Inflicts <ability-innate>Bleed</ability-innate> <body>when you strike an enemy'
          - '<body>with a sword, dealing damage over time.'
          - ''
          - '<body>Skill: <primary><skill>'
          - '<body>Activation Chance: <primary><activation-chance>'
    # Configure localization for the Deeper Wound ability
    deeper-wound:
      display-item:
        name: "<ability-passive><ability></ability-passive>"
        ability-name: "Deeper Wound"
        material: RED_DYE
        # Supports the following placeholders: <skill>, <activation-chance>, <additional-bleed-cycles>, <tier>
        lore:
          - '<body>Enhances Bleed ability to last longer.'
          - ''
          - '<body>Skill: <primary><skill>'
          - '<body>Tier: <primary><tier>'
          - '<body>Activation Chance: <primary><activation-chance>'
          - '<body>Additional Bleed Cycles: <primary><additional-bleed-cycles>'
    # Configure localization for the Enhanced Bleed ability
    enhanced-bleed:
      display-item:
        name: "<ability-passive><ability></ability-passive>"
        ability-name: "Enhanced Bleed"
        material: SPIDER_EYE
        lore:
          - '<body>Enhances Bleed to deal more damage each tick.'
          - '<body>Has a chance to deal bonus damage on top.'
          - ''
          - '<body>Skill: <primary><skill>'
          - '<body>Tier: <primary><tier>'
          - '<body>Base Damage Boost: <primary><base-damage-boost>'
          - '<body>Bonus Damage Chance: <primary><bonus-damage-chance>'
          - '<body>Bonus Damage: <primary><bonus-damage>'
    rage-spike:
      display-item:
        name: "<ability-active><ability></ability-active>"
        ability-name: "Rage Spike"
        material: IRON_SWORD
        lore:
          - '<body>Ready your sword, then crouch to blast forward,'
          - '<body>damaging and knocking back foes in your path.'
          - ''
          - '<body>Skill: <primary><skill>'
          - '<body>Tier: <primary><tier>'
