          - ''
          - '<gray>Skill: <gold><skill>'
          - '<gray>Tier: <gold><tier>'
          - '<gray>Duration: <gold><ability-duration>'
          - '<gray>Bleed Chance Bonus: <gold><activation-chance-increase>'
