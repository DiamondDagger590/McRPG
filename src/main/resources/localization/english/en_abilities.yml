#######################################
#
# English localization for McRPG abilities.
# This file is part of the English (en) locale.
#
# Color Palette
# This file uses semantic color placeholders that resolve to MiniMessage values
# configured in config.yml's palette section. Available placeholders:
#
#   <primary>         Warm Amber (#D4A76A)  -- titles, nav items, stat values
#   <hint>            Warm Yellow (#E8C97A) -- click hints, calls-to-action
#   <mana>            Sky Blue (#5EA8FF)    -- mana costs
#   <ability-active>  Coral (#FF7B5E)       -- active ability names/tags
#   <ability-passive> Sage Green (#7FB87F)  -- passive ability names/tags
#   <ability-innate>  Silver (#9E9E9E)      -- innate abilities, disabled states
#   <body>            Gray                  -- body text, labels
#   <positive>        Green                 -- enabled, success
#   <negative>        Red                   -- disabled, error, deny
#   <warning>         Yellow                -- caution, expiration
#
# Server owners can customize all colors in config.yml under the 'palette' section.
# You can also define your own custom color tags there — any key you add becomes
# a usable <placeholder> in this file.
#
#######################################
locale: en
config-version: 1
# Configure ability placeholders, display items and other text/items.
ability:
  # Mana feedback messages sent to the player when an ability cannot be activated.
  mana-feedback:
    # Sent as a chat message when the player does not have enough mana to activate an ability.
    # Placeholders: <ability> (ability name), <cost> (required mana), <current> (current mana)
    insufficient: "<negative>Not enough mana to use <ability><negative>! <body>(need <cost>, have <current>)"
    # Short HUD flash shown on the action bar when the player lacks mana (~3 seconds).
    # Placeholders: <ability> (ability name)
    insufficient-hud: "<negative>Not Enough Mana"
    # Sent as a chat message when the player attempts to activate an ability that is on cooldown.
    # Placeholders: <ability> (ability name), <remaining> (seconds remaining)
    cooldown-active: "<ability> <negative>is on cooldown! <body>(<remaining>s remaining)"
    # Short HUD flash shown on the action bar when an ability is on cooldown (~3 seconds).
    # Placeholders: <ability> (ability name), <remaining> (seconds remaining)
    cooldown-active-hud: "<negative>On Cooldown <body>(<remaining>s)"
  # Configure messages relating to abilities that can be on cooldown
  cooldown:
    # The message to send to the player when they try to use an ability still on cooldown
    # Supports <ability> as a placeholder for the ability on cooldown.
    ability-still-on-cooldown: "<negative><ability> is still on cooldown."
    # The message to send to the player whenever an ability is no longer on cooldown
    # Supports <ability> as a placeholder for the ability that was on cooldown.
    ability-no-longer-on-cooldown: "<ability> <body>is now off cooldown!"
  # Configure messages for when abilities are unlocked
  # Supports <ability> as a placeholder for the ability name
  unlock:
    # The message to send when a player unlocks a new ability
    ability-unlocked: "<positive>You have unlocked a new ability! <ability> <positive>is now available for use."
    # The message to send when an ability is automatically added to the player's loadout
    ability-added-to-loadout: "<positive>The new ability has automatically been added to your current loadout."
    # The message to send when an ability cannot be added because there's already an active ability for that skill
    # Supports <skill> and <ability> placeholders
    ability-not-added-duplicate-skill: "<negative>You already have an active ability for the skill <skill> <negative>in your loadout, so <ability> <negative>was not automatically added."
  # Configure skill book item display and messages
  # Supports <ability> as a placeholder for the ability name
  skill-book:
    # Display name for the skill book item (shown in inventory)
    item-name: "<primary>Skill Book: <ability>"
    # Lore lines for the skill book item (shown below the name in inventory)
    item-lore:
      - "<body>A mysterious tome of knowledge."
      - "<body>Right-click to unlock <ability><body>."
    # The message to send when a player successfully consumes a skill book
    consumed: "<positive>You consumed a skill book and learned <ability><positive>!"
    # The message to send when a player tries to consume a skill book for an ability they already have
    already-unlocked: "<negative>You have already unlocked <ability><negative>."
    # The message to send when a skill book references an ability that doesn't exist
    unknown-ability: "<negative>This skill book references an unknown ability: <ability><negative>."
  # Configure additional lore lines for ability items that will be appended to ability item lore when conditions are met
  lore:
    # Configure ability upgrade quest lore
    # The following placeholders are supported: <ability-points>, <next-tier-ability-points>, <upgrade-quest-progress>, <quest-percent>
    quest:
      # The lore to add when an ability has an active upgrade quest
      quest-progress:
        - '<body>Upgrade Quest: <primary><quest-percent>% <body>completed'
    # The lore to add when the player isn't high enough level to upgrade the ability.
    # The following placeholders are supported: <next-tier-level>, <skill>
    upgrade-locked-behind-levelup:
      - '<body>Upgrade this ability once you reach <primary>Lv <next-tier-level>'
      - '<body>in <skill><body>.'
    # Locked-ability lore is now rendered dynamically from the ability's unlock conditions
    # via AbilityLoreAppender; see ability.unlock-condition.* below for the per-type templates.
    # This key is kept for back-compat with older locale references but is no longer read.
    ability-locked:
      - '<body>Unlock this ability via the conditions below.'
    # The lore to add to show what expansion pack an ability is from (only will be displayed if it isn't from McRPG)
    # The following placeholders are supported: <expansion-pack>
    expansion-pack:
      - '<body>Expansion Pack: <primary><expansion-pack>'
    # Java-injected type tag lore line (shown for every ability)
    type:
      # Shown for ComboActivatable abilities
      active: '<body>Type: <ability-active>Active'
      # Shown for PassiveAbility abilities that require unlocking
      passive: '<body>Type: <ability-passive>Passive'
      # Shown for abilities with no unlock attribute (always present in loadouts)
      innate: '<body>Type: <ability-innate>Innate'
    # Java-injected mana cost line for ManaAbility abilities with cost > 0.
    # Placeholder: <mana-cost> (resolved to the tier-dependent mana cost integer)
    mana-cost-line: '<body>Mana Cost: <mana><mana-cost>'
    # Java-injected toggle status lines (shown when ability has AbilityToggledOffAttribute)
    status:
      enabled: '<body>Status: <positive>Enabled'
      disabled: '<body>Status: <negative>Disabled'
    # Java-injected click hint lines
    hint:
      # Shown when ability is currently disabled (left-click to enable)
      toggle-enable: '<hint>Left-click <body>to enable'
      # Shown when ability is currently enabled (left-click to disable)
      toggle-disable: '<hint>Left-click <body>to disable'
      # Always shown — all abilities have an edit GUI accessible via right-click
      configure: '<hint>Right-click <body>to configure'
      # Shown for Bedrock (Geyser) players instead of separate left/right hints
      configure-bedrock: '<hint>Click <body>to configure'
  # Templates for the player-facing unlock-condition lore rendered by AbilityLoreAppender.
  # Server owners customize the wording here. Per-type placeholders are documented inline.
  unlock-condition:
    # Shown above the OR-list when an ability has more than one unlock path.
    list-header: '<body>Unlock via any of:'
    # Bullet prefix used for each entry under a header.
    bullet: '<body>  · '
    skill-level:
      # Placeholders: <skill> (colored), <required> (level), <current> (player level)
      description: '<body>Reach <skill> <body>level <primary><required> <hint>(currently <primary><current><hint>)'
      label: '<skill> <primary><current><body>/<primary><required>'
    statistic:
      # Default phrasing when an entry supplies no 'text'/'locale-key'.
      # Placeholders: <statistic>, <required>, <current>
      description: '<body>Reach <primary><required> <body><statistic> <hint>(<primary><current><hint>/<primary><required><hint>)'
    papi:
      # Default phrasing when an entry supplies no 'text'/'locale-key'.
      # Placeholders: <placeholder>, <operator>, <required>, <current>
      description: '<body>Requirement: <primary><placeholder> <operator> <required> <hint>(currently <primary><current><hint>)'
    all-of:
      header: '<body>All of:'
    any-of:
      header: '<body>Any of:'
    # Reserved namespace for translatable display-hint sources referenced by 'locale-key'.
    # Bundled sources (e.g. skill book sources) are added here as abilities adopt them.
    source: {}
  ability-specific-localization:
    # Configure localization for the Bleed ability
    bleed:
      display-item:
        # Allows you to configure how this ability's name will be displayed
        name: "<ability-innate><ability></ability-innate>"
        # The name of this ability to be displayed across McRPG
        ability-name: "Bleed"
        material: REDSTONE
        # Supports the following placeholders: <skill>, <activation-chance>, <bleed-damage>, <bleed-cycles>, <bleed-duration>
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>Sword strikes have a chance to inflict'
          - '<colored-ability><body>, causing the enemy to take'
          - '<body>damage repeatedly over a short duration.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Activation Chance: <primary><activation-chance>%'
          - '<body>Damage per Tick: <primary><bleed-damage> HP'
          - '<body>Tick Count: <primary><bleed-cycles>'
          - '<body>Duration: <primary><bleed-duration>s'
    # Configure localization for the Deeper Wound ability
    deeper-wound:
      display-item:
        name: "<ability-passive><ability></ability-passive>"
        ability-name: "Deeper Wound"
        material: RED_DYE
        # Supports the following placeholders: <skill>, <activation-chance>, <additional-bleed-cycles>, <tier>, <colored-ability_mcrpg_bleed>
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>When <colored-ability_mcrpg_bleed> <body>activates, there is'
          - '<body>a chance it lasts longer than normal,'
          - '<body>dealing more ticks before wearing off.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Tier: <primary><tier>'
          - '<body>Activation Chance: <primary><activation-chance>%'
          - '<body>Extra Ticks: <primary><additional-bleed-cycles>'
    # Configure localization for the Enhanced Bleed ability
    enhanced-bleed:
      display-item:
        name: "<ability-passive><ability></ability-passive>"
        ability-name: "Enhanced Bleed"
        material: SPIDER_EYE
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>Each <colored-ability_mcrpg_bleed> <body>tick deals more damage.'
          - '<body>On top of that, each tick has a chance to'
          - '<body>deal additional bonus damage.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Tier: <primary><tier>'
          - '<body>Base Damage Boost: <primary><base-damage-boost> HP'
          - '<body>Bonus Damage Chance: <primary><bonus-damage-chance>%'
          - '<body>Bonus Damage: <primary><bonus-damage> HP'
    rage-spike:
      display-item:
        name: "<ability-active><ability></ability-active>"
        ability-name: "Rage Spike"
        material: IRON_SWORD
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>Launch yourself forward in the direction'
          - '<body>you''re facing, damaging and knocking back'
          - '<body>all enemies in your path.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Tier: <primary><tier>'
          - '<body>Damage: <primary><damage> HP'
          - '<body>Cooldown: <primary><cooldown>s'
    serrated-strikes:
      display-item:
        name: "<ability-active><ability></ability-active>"
        ability-name: "Serrated Strikes"
        material: STONE_SWORD
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>Temporarily increase your'
          - '<colored-ability_mcrpg_bleed> <body>activation chance after'
          - '<body>striking an enemy.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Tier: <primary><tier>'
          - '<body>Duration: <primary><ability-duration>s'
          - '<body>Bleed Chance Bonus: <primary><activation-chance-increase>%'
          - '<body>Cooldown: <primary><cooldown>s'
    vampire:
      display-item:
        name: "<ability-passive><ability></ability-passive>"
        ability-name: "Vampire"
        material: GHAST_TEAR
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>Each time <colored-ability_mcrpg_bleed> <body>deals damage to'
          - '<body>an enemy, you have a chance to heal a'
          - '<body>portion of that damage back.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Tier: <primary><tier>'
          - '<body>Activation Chance: <primary><activation-chance>%'
          - '<body>Healing: <primary><healing-amount> HP'
    extra-ore:
      display-item:
        name: "<ability-innate><ability></ability-innate>"
        ability-name: "Extra Ore"
        material: DIAMOND
        amount: 2
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>Each block you mine has a chance to drop'
          - '<body>double its normal drops.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Activation Chance: <primary><activation-chance>%'
    its-a-triple:
      display-item:
        name: "<ability-passive><ability></ability-passive>"
        ability-name: "It's A Triple"
        material: DIAMOND
        amount: 3
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>When <colored-ability_mcrpg_extra_ore> <body>triggers, there'
          - '<body>is an additional chance to turn the double'
          - '<body>drop into a triple drop instead.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Tier: <primary><tier>'
          - '<body>Activation Chance: <primary><activation-chance>%'
    ore-scanner:
      display-item:
        name: "<ability-active><ability></ability-active>"
        ability-name: "Ore Scanner"
        material: DIAMOND_ORE
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>Scan the area around you, highlighting all'
          - '<body>nearby ores with a colored glow. Turns you'
          - '<body>toward the most valuable ore detected.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Tier: <primary><tier>'
          - '<body>Range: <primary><range> blocks'
          - '<body>Cooldown: <primary><cooldown>s'
      block-detected: "<body>You've detected <primary><count> <block_type> <body>near you."
    remote-transfer:
      display-item:
        name: "<ability-passive><ability></ability-passive>"
        ability-name: "Remote Transfer"
        material: CHEST
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>Mined blocks automatically teleport into a'
          - '<body>linked chest if it''s within range. Use'
          - '<body><primary>/mcrpg link<body> and <primary>/mcrpg unlink<body> to manage.'
          - '<body>Configure which blocks transfer via the'
          - '<body>ability settings menu.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Tier: <primary><tier>'
          - '<body>Transfer Range: <primary><range> blocks'
    dryads-gift:
      display-item:
        name: "<ability-passive><ability></ability-passive>"
        ability-name: "Dryad's Gift"
        material: EXPERIENCE_BOTTLE
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>Breaking wood blocks has a chance to drop'
          - '<body>bonus experience orbs on the ground.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Tier: <primary><tier>'
          - '<body>Activation Chance: <primary><activation-chance>%'
          - '<body>Experience Dropped: <primary><experience-dropped> XP'
    extra-lumber:
      display-item:
        name: "<ability-innate><ability></ability-innate>"
        ability-name: "Extra Lumber"
        material: OAK_LOG
        amount: 2
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>Each wood block you chop has a chance to'
          - '<body>drop double its normal drops.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Activation Chance: <primary><activation-chance>%'
    nymphs-vitality:
      display-item:
        name: "<ability-passive><ability></ability-passive>"
        ability-name: "Nymph's Vitality"
        material: OAK_SAPLING
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>While in a wooded biome, your hunger will'
          - '<body>not drop below a minimum threshold.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Tier: <primary><tier>'
          - '<body>Minimum Hunger: <primary><minimum-hunger> bars'
    heavy-swing:
      display-item:
        name: "<ability-passive><ability></ability-passive>"
        ability-name: "Heavy Swing"
        material: NETHERITE_AXE
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>When chopping wood, there is a chance to'
          - '<body>break all nearby wood blocks in a radius'
          - '<body>around the one you hit.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Tier: <primary><tier>'
          - '<body>Activation Chance: <primary><activation-chance>%'
          - '<body>Radius: <primary><radius> blocks'
    verdant-surge:
      display-item:
        name: "<ability-active><ability></ability-active>"
        ability-name: "Verdant Surge"
        material: BONE_MEAL
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>Send out multiple pulses of nature energy'
          - '<body>that grow any crop they pass through,'
          - '<body>radiating outward one after another.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Tier: <primary><tier>'
          - '<body>Pulse Count: <primary><pulse-count>'
          - '<body>Pulse Radius: <primary><radius> blocks'
          - '<body>Cooldown: <primary><cooldown>s'
    mass-harvest:
      display-item:
        name: "<ability-active><ability></ability-active>"
        ability-name: "Mass Harvest"
        material: IRON_HOE
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>Send out a pulse that harvests all mature'
          - '<body>crops in its path and automatically replants'
          - '<body>them.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Tier: <primary><tier>'
          - '<body>Pulse Radius: <primary><radius> blocks'
          - '<body>Cooldown: <primary><cooldown>s'
    too-many-plants:
      display-item:
        name: "<ability-innate><ability></ability-innate>"
        ability-name: "Too Many Plants"
        material: CARROT
        amount: 2
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>Harvesting mature crops has a chance to'
          - '<body>drop double their normal yield.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Activation Chance: <primary><activation-chance>%'
    instant-irrigation:
      display-item:
        name: "<ability-innate><ability></ability-innate>"
        ability-name: "Instant Irrigation"
        material: WATER_BUCKET
        item-flags:
          - 'HIDE_ATTRIBUTES'
        lore:
          - '<body>Breaking dirt with a hoe turns it into a'
          - '<body>water source block.'
          - ''
          - '<body>Skill: <skill>'
          - '<body>Cooldown: <primary><cooldown>s'
      activation-message: "<body>You found a water source! You'll be able to do this again in <primary><cooldown> <body>seconds."
