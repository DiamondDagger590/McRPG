#######################################
#
# English localization for McRPG GUI elements.
# This file is part of the English (en) locale.
#
# ─── Color Palette ───
# This file uses semantic color placeholders that resolve to MiniMessage values
# configured in config.yml's palette section. Available placeholders:
#
#   <primary>        Warm Amber (#D4A76A)  — titles, nav items, stat values
#   <hint>           Warm Yellow (#E8C97A) — click hints, calls-to-action
#   <mana>           Sky Blue (#5EA8FF)    — mana costs
#   <ability-active> Coral (#FF7B5E)       — active ability names/tags
#   <ability-passive>Sage Green (#7FB87F)  — passive ability names/tags
#   <ability-innate> Silver (#9E9E9E)      — innate abilities, disabled states
#   <body>           Gray                  — body text, labels
#   <positive>       Green                 — enabled, success
#   <negative>       Red                   — disabled, error, deny
#   <warning>        Yellow                — caution, expiration
#
# Server owners can customize all colors in config.yml under the 'palette' section.
#
#######################################
locale: en
config-version: 1
gui:
  # Allows for configuring slots that are shared commonly across many guis.
  common:
    next-page-button:
      display-item:
        name: "<primary>Next Page"
        material: ARROW
        lore:
          - '<hint>Click <body>this to go to the next page.'
    previous-page-button:
      display-item:
        name: "<primary>Previous Page"
        material: ARROW
        lore:
          - '<hint>Click <body>this to go to the previous page.'
    # Configure the back button
    previous-gui-button:
      display-item:
        name: "<primary>Back to Previous GUI"
        material: BARRIER
        lore:
          - '<hint>Click <body>to return to the previous menu.'
    # Configure the item to be used as a filler for the gui
    filler-item:
      display-item:
        name: ""
        material: GRAY_STAINED_GLASS_PANE
  # The GUI serves as the "main" McRPG gui and is the main access point
  # for most players into McRPG content.
  home-gui:
    title: "<primary>Home GUI"
    # The slot that takes players to the settings gui
    settings-slot:
      display-item:
        material: PLAYER_HEAD
        name: '<primary>Settings'
        lore:
          - '<hint>Click <body>to edit your McRPG settings.'
    # The slot that takes players to the ability gui
    abilities-slot:
      display-item:
        material: DIAMOND_ORE
        name: "<primary>Abilities"
        lore:
          - '<hint>Click <body>to view your abilities.'
    # The slot that takes players to the skills gui
    skills-slot:
      display-item:
        material: DIAMOND_SWORD
        name: "<primary>Skills"
        lore:
          - '<hint>Click <body>to view your skills.'
    # The slot that takes players to the loadout gui.
    loadouts-slot:
      display-item:
        material: COMPASS
        name: "<primary>Loadouts"
        lore:
          - '<hint>Click <body>to edit your loadouts.'
    # The slot that takes players to the experience bank gui.
    experience-bank-slot:
      display-item:
        material: EXPERIENCE_BOTTLE
        name: "<primary>Experience Bank"
        # Supported placeholders: <redeemable-experience>, <redeemable-levels>,
        # <rested-experience> and <boosted-experience>
        lore:
          - '<hint>Click <body>to view banked experience and redeem'
          - '<body>redeemable experience.'
          - ''
          - '<body>Redeemable Experience: <primary><redeemable-experience>'
          - '<body>Redeemable Levels: <primary><redeemable-levels>'
          - '<body>Rested Experience: <primary><rested-experience>'
          - '<body>Boosted Experience: <primary><boosted-experience>'
    # The slot that takes players to the quest gui.
    quests-slot:
      display-item:
        material: WRITABLE_BOOK
        name: "<primary>Quests"
        lore:
          - '<hint>Click <body>to view your active quests.'
    # Placeholder for the future quest board feature.
    coming-soon-slot:
      display-item:
        material: GRAY_STAINED_GLASS_PANE
        name: "<ability-innate>Coming Soon"
        lore:
          - '<body>Quest Board coming in a future update!'
    board-slot:
      display-item:
        material: OAK_SIGN
        name: "<primary>Quest Board"
        lore:
          - '<hint>Click <body>to browse and accept'
          - '<body>daily and weekly quests.'
  # This GUI shows the quest board offerings.
  quest-board:
    title: '<primary>Quest Board'
    # Configure the slot players click to go back to the home gui.
    # Remove this to use the common previous gui button instead.
    previous-gui-button:
      display-item:
        name: "<primary>Back to Home"
        material: BARRIER
        lore:
          - '<hint>Click <body>to return to the home menu.'
    offering-lore:
      - '<body>Rarity: <primary><rarity>'
      - '<body>Category: <primary><category>'
      - ''
      - '<positive>Click <body>to accept'
    # Board offering slot. Placeholders: <quest_name>, <rarity_color>
    offering-slot:
      display-item:
        material: PAPER
        name: '<rarity_color><quest_name>'
    # Scoped (group) offering slot. Placeholders: <quest_name>, <rarity_color>
    scoped-offering-slot:
      display-item:
        material: PAPER
        name: '<rarity_color><quest_name>'
    no-offerings-slot:
      display-item:
        material: BARRIER
        name: '<negative>No Offerings'
        lore:
          - '<body>There are no quest offerings available right now.'
          - '<body>Check back after the next rotation.'
    accept: '<positive>Quest accepted!'
    slots-full: '<negative>You have no available quest slots.'
    on-cooldown: '<negative>This quest is on cooldown.'
    # Scoped (group) quest entries
    group-tab:
      display-item:
        material: COMPASS
        name: '<primary>Group Quests'
        lore:
          - '<hint>Click <body>to view group quests.'
    group-selector-title: '<primary>Select a Group'
    # Placeholders: <entity_name>, <quest_count>
    group-entity-slot:
      display-item:
        material: SHIELD
        name: '<primary><entity_name>'
        lore:
          - '<body>Active quests: <primary><quest_count>'
          - ''
          - '<hint>Click <body>to view offerings'
    group-no-offerings:
      display-item:
        material: BARRIER
        name: '<ability-innate>No Group Quests Available'
        lore:
          - '<body>New offerings are generated at the next rotation.'
    # Slot shown for each selectable scoped entity (e.g. a Lands territory) in the entity-picker GUI.
    # Placeholders: <scope_name> (the group/territory name)
    group-entity-select-slot:
      display-item:
        material: SHIELD
        name: '<primary><scope_name>'
        lore:
          - '<hint>Click <body>to view offerings for this group.'
    group-accept: '<positive>Group quest accepted!'
    group-abandon: '<warning>Group quest abandoned.'
    group-no-permission: '<negative>Ask your group leader to manage quests.'
    group-slots-full: '<negative>This group has no available quest slots.'
    # Appended to each scoped offering item. Placeholder: <entity_name>
    group-entity-lore: '<body>Group: <primary><entity_name>'
    # Offering item lore lines (Phase 4) — built programmatically in BoardOfferingSlot / ScopedOfferingSlot.
    # Placeholders: <rarity_color>, <rarity>
    rarity-line: '<body>Rarity: <rarity_color><rarity>'
    # Placeholder: <duration> (formatted time, e.g. "2h 30m", or "None")
    duration-line: '<body>Duration: <primary><duration>'
    # Placeholders: <count_color>, <board_quests>, <max_quests>
    board-quests-line: '<body>Board Quests: <count_color><board_quests>/<max_quests>'
    right-click-preview: '<hint>Right-click <body>to preview'
    # Offering lore components (Phase 4). Placeholders: <category>, <type>, <amount>, <time>
    offering-category: '<body>Category: <primary><category>'
    objectives-header: '<body>Objectives:'
    # Placeholders: <type> (objective type key), <amount> (required progress)
    objective-line: '<white>  • <type>: <primary><amount>'
    rewards-header: '<body>Rewards:'
    # Placeholders: <type> (reward type key), <amount> (numeric amount)
    reward-line: '<white>  • <type>: <primary><amount>'
    # Placeholder: <type> (reward type key, no numeric amount available)
    reward-line-no-amount: '<white>  • <type>'
    # Placeholder: <time> (formatted time remaining, e.g. "2h 30m")
    expires-in: '<body>Expires in: <warning><time>'
    click-to-accept: '<positive>Click <body>to accept'
    # Distribution preview components for scoped quests
    distribution-header: '<body>Reward Distribution:'
    # Placeholder: <tier> (tier identifier)
    distribution-tier: '<white>  <tier>:'
    preview-qualifies: '<positive>  ✔ You qualify for this tier'
    preview-not-qualifies: '<negative>  ✘ You do not yet qualify'
    # Placeholder: <contribution>, <percent>
    preview-contribution: '<body>  Your contribution: <primary><contribution> <body>(<primary><percent>%<body>)'
  # This GUI shows all active quests for the player.
  active-quest-gui:
    title: '<primary>Active Quests'
    previous-gui-button:
      display-item:
        name: "<primary>Back to Home"
        material: BARRIER
        lore:
          - '<hint>Click <body>to return to the home menu.'
    # Template for each active quest item. Placeholders: <quest_name>
    # Phase, objectives, expiry, and click hint are appended dynamically.
    quest-slot:
      display-item:
        material: WRITABLE_BOOK
        name: "<primary><quest_name>"
        lore: []
      phase-line: '<body>Phase: <primary><current_phase>/<total_phases>'
      objective-progress-line: '<body><objective_description>: <primary><current_progress>/<required_progress>'
      objective-detail-line: '<body><objective_description>'
      expires-line: '<body>Expires in: <primary><time_remaining>'
      expires-time-format: '<hours>h <minutes>m'
      expires-expired: '<negative>Expired'
      expires-none: '<body>None'
      click-to-view-details: '<hint>Click <body>to view details'
      right-click-to-abandon: '<negative>Right-click <body>to abandon'
    view-history-button:
      display-item:
        material: BOOKSHELF
        name: "<primary>Quest History"
        lore:
          - '<hint>Click <body>to view your completed quests.'
  # This GUI shows the player's completed quest history.
  quest-history-gui:
    title: '<primary>Quest History'
    previous-gui-button:
      display-item:
        name: "<primary>Back to Active Quests"
        material: BARRIER
        lore:
          - '<hint>Click <body>to return to your active quests.'
    sort-date-desc:
      display-item:
        material: HOPPER
        name: "<primary>Sort: Newest First"
        lore:
          - '<hint>Click <body>to sort by oldest first.'
    sort-date-asc:
      display-item:
        material: HOPPER
        name: "<primary>Sort: Oldest First"
        lore:
          - '<hint>Click <body>to sort by newest first.'
    # Template for each completed quest. Placeholders: <quest_name>, <completed_date>
    completed-quest-slot:
      display-item:
        material: WRITTEN_BOOK
        name: "<primary><quest_name>"
        lore:
          - '<body>Completed: <primary><completed_date>'
          - ''
          - '<hint>Click <body>to view details'
    # Fallback when a quest definition no longer exists.
    unknown-quest-slot:
      display-item:
        material: BARRIER
        name: "<negative><quest_name>"
        lore:
          - '<body>Completed: <primary><completed_date>'
          - '<negative>Quest definition no longer exists.'
  # This GUI shows the detailed breakdown of a quest's phases, stages and objectives.
  quest-detail-gui:
    title: '<primary>Quest Details'
    # Context-specific back labels (sub-menu style: full title + sentence lore, like quest-history-gui).
    previous-gui-button:
      from-board:
        display-item:
          name: "<primary>Back to Quest Board"
          material: BARRIER
          lore:
            - '<hint>Click <body>to return to the quest board.'
      from-history:
        display-item:
          name: "<primary>Back to Quest History"
          material: BARRIER
          lore:
            - '<hint>Click <body>to return to quest history.'
      from-active:
        display-item:
          name: "<primary>Back to Active Quests"
          material: BARRIER
          lore:
            - '<hint>Click <body>to return to active quests.'
    # Overview header slot. Placeholders: <quest_name>, <quest_state>, <start_time>,
    # <end_time>, <expiration_time>, <completed_date>, <phase_total>
    overview-slot:
      display-item:
        material: ENCHANTED_BOOK
        name: "<primary><quest_name>"
        lore:
          - '<body>State: <primary><quest_state>'
          - '<body>Phases: <primary><phase_total>'
    # Phase header. Placeholders: <phase_number>, <phase_total>, <completion_mode>
    phase-header:
      display-item:
        material: YELLOW_STAINED_GLASS_PANE
        name: "<primary>Phase <phase_number>/<phase_total>"
        lore:
          - '<body>Completion mode: <primary><completion_mode>'
    # Stage slot. Placeholders: <stage_number>, <stage_total>, <objective_count>
    # State line is appended dynamically using the stage-state.* keys below.
    stage-slot:
      display-item:
        material: PAPER
        name: "<primary>Stage <stage_number>/<stage_total>"
        lore:
          - '<body>Objectives: <primary><objective_count>'
      # State lore line appended below the stage display item lore.
      # Placeholder: <state> = stage state display label (resolved from stage-state.* below)
      state-line: "<body>State: <primary><state>"
      # QuestStageState display labels used in the <state> placeholder.
      stage-state:
        not-started: "Not Started"
        in-progress: "In Progress"
        completed: "Completed"
        cancelled: "Cancelled"
    # Objective slot. Placeholders: <objective_description>
    # Progress and state lines are appended dynamically using the keys below.
    objective-slot:
      display-item:
        material: MAP
        name: "<body><objective_description>"
        lore: []
      # Progress lore line appended below the objective description.
      # Placeholders: <progress> = current progress, <required> = goal
      progress-line: "<body>Progress: <primary><progress>/<required>"
      # State lore line appended below the progress line.
      # Placeholder: <state> = objective state display label (resolved from objective-state.* below)
      state-line: "<body>State: <primary><state>"
      # Continuation line for multi-line objective descriptions (lines after the first).
      # Placeholder: <line>
      description-continuation-line: "<body><line>"
    # Reward summary slot shown in board preview. Placeholders: <quest_name>
    # Reward lines are appended dynamically as individual lore entries.
    reward-slot:
      display-item:
        material: GOLD_INGOT
        name: "<primary>Quest Completion Rewards"
        lore:
          - '<body>Rewards earned when the entire quest is'
          - '<body>completed. Phase, stage, and objective'
          - '<body>rewards are shown on each slot.'
          - ''
      # Shown as a lore line in the reward slot when the quest has no configured rewards.
      no-rewards: '<body>No rewards listed'
      # Section header for quest-level completion rewards. No placeholders.
      completion-header: "<primary><bold>Completion Rewards:"
      # Section header for per-objective rewards.
      # Placeholders: <phase> = phase number (1-based), <objective> = truncated objective description
      phase-header: "<primary>Phase <phase> - <objective>:"
      # Individual reward entry. Placeholder: <reward>
      reward-entry-line: "<body>  - <white><reward>"
    # Header appended to phase/stage/objective slot lore when that level has rewards.
    # No placeholders.
    inline-reward-header: "<primary>Rewards:"
    # Individual reward entry appended below the inline-reward-header.
    # Placeholder: <reward> = the reward's display description
    inline-reward-line: "<body>  - <white><reward>"
    # PhaseCompletionMode display labels used in the <completion_mode> placeholder.
    completion-mode:
      # All stages in the phase must be completed.
      all: "Complete all stages"
      # Any single stage completing advances the phase.
      any: "Complete any one stage"
    # QuestObjectiveState display labels used in the <state> placeholder.
    objective-state:
      not-started: "Not Started"
      in-progress: "In Progress"
      completed: "Completed"
      cancelled: "Cancelled"
    # Quest duration slot shown in quest detail GUI navigation row.
    # Placeholder: <quest_duration>
    duration-slot:
      display-item:
        material: CLOCK
        name: "<primary>Quest Duration"
        lore:
          - '<body>Expires after: <primary><quest_duration>'
    # Abandon button in the quest detail navigation bar (only shown for active abandonable quests).
    abandon-button:
      display-item:
        material: RED_WOOL
        name: "<negative>Abandon Quest"
        lore:
          - '<negative>Click <body>to abandon this quest.'
          - '<body>This action requires confirmation.'
    # Label shown as the quest_state placeholder when viewing a quest preview (not yet accepted).
    state-preview: 'Preview'
    # Label shown as the quest_state placeholder when viewing a completed quest's history.
    state-completed: 'Completed'
  # Confirmation GUI shown before abandoning a quest.
  quest-abandon-confirm-gui:
    title: '<negative>Confirm Abandon'
    # Confirm button. Placeholders: <quest_name>
    confirm-button:
      display-item:
        material: TNT
        name: "<negative>Abandon Quest"
        lore:
          - '<negative>Click <body>to abandon <primary><quest_name><body>.'
          - ''
          - '<negative>This cannot be undone!'
    # Cancel button to go back without abandoning.
    cancel-button:
      display-item:
        material: LIME_WOOL
        name: "<positive>Go Back"
        lore:
          - '<hint>Click <body>to cancel and go back.'
    # Quest info display in the middle. Placeholders: <quest_name>
    quest-info:
      display-item:
        material: WRITABLE_BOOK
        name: "<primary><quest_name>"
        lore:
          - '<body>You are about to abandon this quest.'
  # This GUI allows players to view and edit their abilities.
  ability-gui:
    title: '<primary>Viewing Abilities'
    # Configure the slot players click to go back to the home gui.
    # Remove this to use the common previous gui button instead.
    previous-gui-button:
      display-item:
        name: "<primary>Back to Home"
        material: BARRIER
        lore:
          - '<hint>Click <body>to return to the home menu.'
  # Some GUIs (such as the ability gui) have different ability sort options that are provided.
  # This allows for configuring those options.
  ability-sort-types:
    alphabetical:
      display-item:
        name: "<primary>Alphabetical Sort"
        material: BAMBOO_HANGING_SIGN
        lore:
          - '<hint>Click <body>to change how abilities are sorted.'
    innate-abilities:
      display-item:
        name: "<primary>Innate Abilities Sort"
        material: REDSTONE
        lore:
          - '<hint>Click <body>to change how abilities are sorted.'
    skill:
      display-item:
        name: "<primary>Sort by Skill"
        material: DIAMOND_SWORD
        lore:
          - '<hint>Click <body>to change how abilities are sorted.'
    unlocked-abilities:
      display-item:
        name: "<primary>Sort by Unlock Level"
        material: DIAMOND
        lore:
          - '<hint>Click <body>to change how abilities are sorted.'
    upgradable-abilities:
      display-item:
        name: "<primary>Sort by Abilities you can upgrade"
        material: DIAMOND
        lore:
          - '<hint>Click <body>to change how abilities are sorted.'
    passive-abilities:
      display-item:
        name: "<primary>Sort by Passive Abilities"
        material: GHAST_TEAR
        lore:
          - '<hint>Click <body>to change how abilities are sorted.'
    active-abilities:
      display-item:
        name: "<primary>Sort by Active Abilities"
        material: STONE_SWORD
        lore:
          - '<hint>Click <body>to change how abilities are sorted.'
    loadout-order:
      display-item:
        name: "<primary>Sort by Loadout Order"
        material: PAPER
        lore:
          - '<hint>Click <body>to change how abilities are sorted.'
  # This GUI allows players to view and edit their skills.
  skill-gui:
    title: '<primary>Viewing Skills'
    # Configure the slot players click to go back to the home gui.
    # Remove this to use the common previous gui button instead.
    previous-gui-button:
      display-item:
        name: "<primary>Back to Home"
        material: BARRIER
        lore:
          - '<hint>Click <body>to return to the home menu.'
  # Some GUIs (such as the skills gui) have different skill sort options that are provided.
  # This allows for configuring those options.
  skill-sort-types:
    alphabetical:
      display-item:
        name: "<primary>Alphabetical Sort"
        material: BAMBOO_HANGING_SIGN
        lore:
          - '<hint>Click <body>to change how skills are sorted.'
    skill-level:
      display-item:
        name: "<primary>Skill Level Sort"
        material: DIAMOND_ORE
        lore:
          - '<hint>Click <body>to change how skills are sorted.'
    experience-to-level:
      display-item:
        name: "<primary>Skill Remaining Exp To Level Sort"
        material: EXPERIENCE_BOTTLE
        lore:
          - '<hint>Click <body>to change how skills are sorted.'
  # This GUI allows for editing an ability's attributes. Since these items are shared
  # across multiple GUIs, they are configured under the ability.ability-attribute section.
  ability-edit-gui:
    title: '<primary>Editing <ability>'
    # Configure the slot players click to go back to the home gui.
    # Remove this to use the common previous gui button instead.
    previous-gui-button:
      display-item:
        name: "<primary>Back to Viewing Abilities"
        material: BARRIER
        lore:
          - '<hint>Click <body>to return to the ability list.'
    # Allows configuration of displaying different states of a location attribute (such as Remote Transfer)
    location-attribute:
      # What item should be used if there is no location saved for this attribute?
      no-location-saved:
        display-item:
          name: "<primary>Bound Location"
          material: CHERRY_SIGN
          lore:
            - "<body>You currently don't have a bound location for this ability."
      # What item should be used if there is a location saved for this attribute?
      location-saved:
        display-item:
          name: "<primary>Bound Location"
          material: CHERRY_SIGN
          # Supports the following placeholders: <location>, <location-x>, <location-y>, <location-z>, <location-world>
          lore:
            - "<body>This ability's bound location is:"
            - "<body>X: <primary><location-x>"
            - "<body>Y: <primary><location-y>"
            - "<body>Z: <primary><location-z>"
            - "<body>World: <primary><location-world>"
    # Allows configuration of the ability's tier.
    # This may have additional lore appended to it based on things like upgrade eligibility, upgrade cost,
    # upgrade quest progress, etc.
    # These additional lores are used elsewhere too, so they will not be configured here. They can be configured
    # in ability.lore
    tier-attribute:
      display-item:
        name: "<primary>Ability Tier Upgrade"
        material: IRON_INGOT
        # Supports the following placeholders: <tier>
        lore:
          - "<body>Tier: <primary><tier>"
    toggled-off-attribute:
      toggled-off:
        display-item:
          name: "<primary>Ability Toggle Status"
          material: REDSTONE_BLOCK
          lore:
            - "<body>Ability is currently <negative>disabled</negative>."
            - "<positive>Click <body>to enable this ability."
      toggled-on:
        display-item:
          name: "<primary>Ability Toggle Status"
          material: EMERALD_BLOCK
          lore:
            - "<body>Ability is currently <positive>enabled</positive>."
            - "<negative>Click <body>to disable this ability."
    remote-transfer-block-toggle-attribute:
      display-item:
        material: CHEST
        name: "<primary>Block Filter"
        lore:
          - "<hint>Click <body>to edit what blocks can"
          - "<body>and can't be transferred."
    mass-harvest-pull-items-attribute:
      toggled-off:
        display-item:
          name: "<primary>Mass Harvest Pull Status"
          material: STONE_HOE
          lore:
            - "<body>Mass Harvest <negative>will NOT</negative> pull"
            - "<body>dropped items towards you."
            - "<positive>Click <body>to enable the pull effect."
      toggled-on:
        display-item:
          name: "<primary>Mass Harvest Pull Status"
          material: IRON_HOE
          lore:
            - "<body>Mass Harvest <positive>will currently</positive> pull"
            - "<body>dropped items towards you."
            - "<negative>Click <body>to disable the pull effect."
  # This GUI allows for players to view the current state of their loadout
  loadout-gui:
    # The title of the gui.
    # Supported placeholders: <loadout-name>
    title: "<primary>Editing Loadout: <loadout-name>"
    # This slot shows a slot that players
    invalid-slot:
      display-item:
        material: RED_STAINED_GLASS_PANE
        name: " "
    # Configure the slot players click to change an ability that is already in their loadout.
    ability-slot:
      # The item displayed is from the ability's display, but this lore is appended to let players know what to do
      additional-lore:
        - ''
        - '<hint>Click <body>to change what ability is in this slot.'
    # Configure the slot players can click to add an ability to an empty slot in the loadout.
    free-ability-slot:
      display-item:
        material: CYAN_STAINED_GLASS_PANE
        name: '<primary>Empty Loadout Slot'
        lore:
          - ''
          - '<hint>Click <body>to change what ability is in this slot.'
    # Configure the slot players can click to open the menu to edit their loadout displays
    loadout-display-open-slot:
      display-item:
        material: OAK_HANGING_SIGN
        name: '<primary>Edit Loadout Display'
        lore:
          - '<hint>Click <body>to change how this loadout is displayed.'
    # Configure the combo info slot shown at the top-center of the combo zone.
    # This is a static informational item — it cannot be clicked.
    combo-info-slot:
      display-item:
        material: KNOWLEDGE_BOOK
        name: '<primary>Combo Abilities'
        lore:
          - '<body>Active abilities are triggered'
          - '<body>by performing click combos.'
          - ''
          - '<yellow>R <dark_gray>= <body>Right Click'
          - '<aqua>L <dark_gray>= <body>Left Click'
          - ''
          - '<body>Slot 1: <yellow>R<dark_gray> → <yellow>R<dark_gray> → <yellow>R'
          - '<body>Slot 2: <yellow>R<dark_gray> → <yellow>R<dark_gray> → <aqua>L'
          - '<body>Slot 3: <yellow>R<dark_gray> → <aqua>L<dark_gray> → <yellow>R'
    # Configure the light-blue filler item used in the combo row.
    # These panes double as the combo info legend — hovering any filler explains the system.
    combo-zone-filler:
      display-item:
        material: LIGHT_BLUE_STAINED_GLASS_PANE
        name: '<primary>Combo Abilities'
        lore:
          - '<body>Active abilities are triggered'
          - '<body>by performing click combos.'
          - ''
          - '<yellow>R <dark_gray>= <body>Right Click'
          - '<aqua>L <dark_gray>= <body>Left Click'
          - ''
          - '<body>Slot 1: <yellow>R<dark_gray> → <yellow>R<dark_gray> → <yellow>R'
          - '<body>Slot 2: <yellow>R<dark_gray> → <yellow>R<dark_gray> → <aqua>L'
          - '<body>Slot 3: <yellow>R<dark_gray> → <aqua>L<dark_gray> → <yellow>R'
    # Configure the active ability combo slots in the combo zone.
    active-combo-slot:
      # Additional lore appended to occupied active combo slots.
      # Supported placeholders: <combo-pattern> (e.g. "R → R → R")
      occupied:
        additional-lore:
          - ''
          - '<body>Combo: <combo-pattern>'
          - '<hint>Press <primary>1<body>/<primary>2<body>/<primary>3 <body>to move to that slot'
          - '<hint>Click <body>to change ability'
        # Appended after additional-lore only when the ability has an active upgrade quest.
        # Supported placeholders: <upgrade-quest-progress>
        upgrade-quest-progress-lore:
          - ''
          - '<body>Upgrade Quest: <upgrade-quest-progress>'
      # Display item for empty active combo slots.
      # Supported placeholders: <combo-pattern> (e.g. "R → R → R")
      empty:
        display-item:
          material: ARMOR_STAND
          name: '<ability-innate>Empty Combo Slot'
          lore:
            - '<body>Combo: <combo-pattern>'
            - ''
            - '<body>Assign an active ability to'
            - '<body>this slot to use this combo.'
            - ''
            - '<hint>Click <body>to assign'
      # Localizable display strings for each combo pattern.
      # Colors, arrows, and characters are fully configurable.
      pattern:
        slot-1: '<yellow>R<dark_gray> → <yellow>R<dark_gray> → <yellow>R'
        slot-2: '<yellow>R<dark_gray> → <yellow>R<dark_gray> → <aqua>L'
        slot-3: '<yellow>R<dark_gray> → <aqua>L<dark_gray> → <yellow>R'
    # Configure the slot players can click to go from the loadout gui back to the loadout select gui.
    previous-gui-button:
      display-item:
        material: BARRIER
        name: '<primary>Back to Viewing Loadouts'
        lore:
          - '<hint>Click <body>to return to the loadout list.'
  # This GUI allows for players to choose which loadout they want to set as active or edit
  loadout-selection-gui:
    # The title of the gui
    title: '<primary>Viewing Loadouts'
    # Configure the slot players click to go back to the home gui.
    # Remove this to use the common previous gui button instead.
    previous-gui-button:
      display-item:
        name: "<primary>Back to Home"
        material: BARRIER
        lore:
          - '<hint>Click <body>to return to the home menu.'
    # Configure the slot for any bedrock players using geyser
    # Uses the loadout's display item for the slot so the <material> field will do nothing here.
    loadout-selection-slot-geyser:
      # Configure the slot for any bedrock players using geyser when the current loadout is active
      active-loadout:
        name: '<primary><name>'
        lore:
          - '<hint>Click <body>to edit this loadout.'
          - '<body>This is your currently selected loadout.'
        enchantments:
          POWER: 1
        item-flags:
          - 'HIDE_ENCHANTS'
      # Configure the slot for any bedrock players using geyser when the current loadout is inactive
      inactive-loadout:
        name: '<primary><name>'
        lore:
          - '<hint>Click <body>to edit this loadout.'
    # Configure the slot for any players not using geyser
    # Uses the loadout's display item for the slot so the <material> field will do nothing here.
    loadout-selection-slot:
      # Configure the slot for any players not using geyser when the current loadout is active
      active-loadout:
        name: '<primary><name>'
        lore:
          - '<hint>Left-click <body>to edit this loadout.'
          - '<hint>Right-click <body>to set this loadout as active.'
          - '<body>This is your currently selected loadout.'
        enchantments:
          POWER: 1
        item-flags:
          - 'HIDE_ENCHANTS'
      # Configure the slot for any players not using geyser when the current loadout is inactive
      inactive-loadout:
        name: '<primary><name>'
        lore:
          - '<hint>Left-click <body>to edit this loadout.'
          - '<hint>Right-click <body>to set this loadout as active.'
    # A line appended to every loadout selection slot showing which active (combo) abilities are
    # currently in that loadout. Supported placeholder: <active-abilities>
    # This line is only added when at least one active ability is assigned.
    active-abilities-preview: '<body>Actives: <active-abilities>'
  # This GUI allows for selecting different editing options for a given loadout
  loadout-display-home-gui:
    # The title of the GUI
    # Supports the following placeholders: <loadout-name>
    title: "<primary>Editing Loadout <loadout-name>"
    # Configure the slot players can click to edit the name of their loadout
    edit-name-slot:
      # What message should be sent to players to prompt them for a new name in chat?
      name-input-request-prompt: '<body>Please type in chat the name you want this loadout to be called, or type <primary>cancel</primary> to cancel:'
      # How to display this slot in a GUI?
      display-item:
        material: OAK_HANGING_SIGN
        name: '<primary>Loadout Display Name'
        lore:
          - "<hint>Click <body>to change what the loadout's name is."
    # Configure the slot players can click to edit the display item of their loadout
    edit-display-item-slot:
      # This display item doesn't use the `material` key, instead the value is pulled from whatever
      # item is currently being used as the display for the loadout,
      display-item:
        name: '<primary>Loadout Display Item'
        lore:
          - '<hint>Click <body>to change what item is used to display the loadout.'
    # Configure the slot players can click to toggle the laodout being active
    toggle-loadout-slot:
      # Configure the slot to be shown to players when the loadout they're viewing is currently active.
      active-display-item:
        material: GREEN_STAINED_GLASS_PANE
        name: '<primary>Loadout Active State'
        lore:
          - '<body>This loadout is currently <positive>active</positive>.'
      # Configure the slot to be shown to players when the loadout they're viewing is currently inactive.
      inactive-display-item:
        material: RED_STAINED_GLASS_PANE
        name: '<primary>Loadout Active State'
        lore:
          - '<body>This loadout is currently <negative>inactive</negative>.'
          - '<hint>Click <body>to set this loadout as your active loadout.'
  # This GUI allows for players to put an item into the GUI to set it as the display item for their GUI
  loadout-display-item-input-gui:
    title: '<primary>Input Loadout Display Item'
    # Configure the slot that surrounds the input slot
    item-input-highlight-slot:
      display-item:
        material: PURPLE_STAINED_GLASS_PANE
        name: ""
    # Configure the slot players can click to cancel editing the loadout's display item
    cancel-item-edit-slot:
      display-item:
        material: BARRIER
        name: '<primary>Cancel editing loadout display item.'
        lore:
          - '<hint>Click <body>to cancel editing loadout display item.'
    # Configure the slot players can click to confirm the loadout's new display item
    confirm-item-edit-slot:
      display-item:
        material: GREEN_STAINED_GLASS_PANE
        name: '<primary>Loadout Display Item'
        lore:
          - '<hint>Click <body>to change what item is used to display the loadout.'
  # This GUI allows players to select abilities to put into their loadouts.
  loadout-ability-select-gui:
    title: '<primary>Select ability to use.'
    # Configure the slot players click to go back to the loadout menu.
    # Remove this to use the common previous gui button instead.
    previous-gui-button:
      display-item:
        name: "<primary>Back to Editing Loadout"
        material: BARRIER
        lore:
          - '<hint>Click <body>to return to your loadout.'
    # Configure the slot players click to add an ability to their loadout.
    ability-select-slot:
      # The item displayed is from the ability's display, but this lore is appended to let players know what to do
      additional-lore:
        - '<hint>Click <body>to add this ability to your loadout.'
  # This GUI allows players to toggle their different settings.
  player-setting-gui:
    # The title of the gui
    title: '<primary>Editing Settings'
    # Configure the slot players click to go back to the home gui.
    # Remove this to use the common previous gui button instead.
    previous-gui-button:
      display-item:
        name: "<primary>Back to Home"
        material: BARRIER
        lore:
          - '<hint>Click <body>to return to the home menu.'
    # Configure the slot representing the experience display setting controlling how players can get experience updates visually.
    experience-display-setting-slot:
      # Configure the setting display for when the setting is set to BOSS_BAR
      boss-bar:
        display-item:
          material: DRAGON_HEAD
          name: '<primary>Experience Display'
          lore:
            - '<body>Displays gained experience through a boss bar.'
            - ''
            - '<hint>Click <body>to change this display setting.'
      # Configure the setting display for when the setting is set to ACTION_BAR
      action-bar:
        display-item:
          material: BLAZE_ROD
          name: '<primary>Experience Display'
          lore:
            - '<body>Displays gained experience through an action bar.'
            - ''
            - '<hint>Click <body>to change this display setting.'
    # Configure the slot representing the setting controlling if picked up items will go into a player's empty hand or not.
    keep-hand-empty-setting-slot:
      # Configure the setting display for when the setting is ENABLED
      enabled:
        display-item:
          material: GREEN_STAINED_GLASS_PANE
          name: '<primary>Keep Hand Empty'
          lore:
            - '<body>Status: <positive>Enabled</positive>.'
            - '<body>Prevents picked up items from going into your hand if it is empty.'
            - ''
            - '<hint>Click <body>to change this setting.'
      # Configure the setting display for when the setting is DISABLED
      disabled:
        display-item:
          material: RED_STAINED_GLASS_PANE
          name: '<primary>Keep Hand Empty'
          lore:
            - '<body>Status: <negative>Disabled</negative>.'
            - '<body>Lets picked up items go into your hand.'
            - ''
            - '<hint>Click <body>to change this setting.'
    # Configure the slot representing the setting controlling if a dedicated hotbar slot will skip having items automatically added to it.
    keep-hotbar-slot-empty-setting-slot:
      # Configure the setting display for when the setting is DISABLED
      disabled:
        display-item:
          material: RED_SHULKER_BOX
          name: '<primary>Keep Hotbar Slot Empty'
          lore:
            - '<body>Status: <negative>Disabled</negative>.'
            - ''
            - '<hint>Click <body>to enable this setting.'
      # Configure the setting display for when the setting is ENABLED for a specific slot
      enabled:
        # The count of the display item will be automatically incremented to indicate what slot is being reserved.
        # Ex) an item stack count of 8 to represent the 8th hotbar slot.
        # Supported placeholders: <slot>
        display-item:
          material: GREEN_SHULKER_BOX
          name: '<primary>Keep Hotbar Slot Empty'
          lore:
            - '<body>Empty Slot: <primary><slot>.'
            - '<body>Prevents picked up items going into the designated slot.'
            - ''
            - '<hint>Click <body>to change this setting.'
    # Configure the slot representing the setting controlling the player's McRPG locale
    locale-setting-slot:
      # Configure the setting display for when the setting is set to use the player's client locale.
      client-locale:
        display-item:
          material: DIRT
          name: '<primary>Client Language'
          lore:
            - '<body>Tries to use your client language for McRPG where possible.'
            - ''
            - '<hint>Click <body>to change this display setting.'
      # Configure the setting display for when the setting is set to use the server's default locale.
      server-locale:
        display-item:
          material: COMPASS
          name: '<primary>Server Language'
          lore:
            - '<body>Tries to use the server default language for McRPG where possible.'
            - ''
            - '<hint>Click <body>to change this display setting.'
      # Configure the setting display for when no other locale option is used
      fallback-locale:
        display-item:
          material: OAK_HANGING_SIGN
          name: "<primary><locale>"
          lore:
            - "<body>Tries to use <locale> for McRPG where possible."
            - ''
            - '<hint>Click <body>to change this display setting.'
    # Configure the slot representing the setting if the player needs an empty offhand to activate an ability
    require-empty-offhand-to-active-ability-slot:
      # Configure the setting display for when the setting is DISABLED
      disabled:
        display-item:
          material: RED_STAINED_GLASS_PANE
          name: '<primary>Require Empty Offhand'
          lore:
            - '<body>Status: <negative>Disabled</negative>.'
            - '<body>Abilities can not be readied if you have an item in your offhand.'
            - ''
            - '<hint>Click <body>to enable this setting.'
      # Configure the setting display for when the setting is ENABLED for a specific slot
      enabled:
        # The count of the display item will be automatically incremented to indicate what slot is being reserved.
        # Ex) an item stack count of 8 to represent the 8th hotbar slot.
        # Supported placeholders: <slot>
        display-item:
          material: GREEN_STAINED_GLASS_PANE
          name: '<primary>Require Empty Offhand'
          lore:
            - '<body>Status: <positive>Enabled</positive>.'
            - '<body>Abilities can be readied even with an item in your offhand.'
            - ''
            - '<hint>Click <body>to change this setting.'
    # Configure the slot representing the setting to disable consumption of rested and boosted experience
    disable-bonus-experience-consumption-setting-slot:
      # Configure the setting display for when the setting is ENABLED (consumption is disabled)
      enabled:
        display-item:
          material: RED_STAINED_GLASS_PANE
          name: '<primary>Bonus Experience Consumption'
          lore:
            - '<body>Status: <negative>Disabled</negative>.'
            - '<body>Rested and boosted experience will not be consumed.'
            - '<body>You will not receive bonus experience while this is enabled.'
            - ''
            - '<hint>Click <body>to enable bonus experience consumption.'
      # Configure the setting display for when the setting is DISABLED (consumption is enabled)
      disabled:
        display-item:
          material: GREEN_STAINED_GLASS_PANE
          name: '<primary>Bonus Experience Consumption'
          lore:
            - '<body>Status: <positive>Enabled</positive>.'
            - '<body>Rested and boosted experience will be consumed normally.'
            - '<body>You will receive bonus experience from your pools.'
            - ''
            - '<hint>Click <body>to disable bonus experience consumption.'
    # Configure the slot representing the quest progress notification setting
    quest-progress-notification-setting-slot:
      # Configure the setting display for when the setting is ENABLED (notifications are on)
      enabled:
        display-item:
          material: GREEN_STAINED_GLASS_PANE
          name: '<primary>Quest Progress Notifications'
          lore:
            - '<body>Status: <positive>Enabled</positive>.'
            - '<body>You will receive chat notifications when you'
            - '<body>reach progress milestones on quest objectives.'
            - ''
            - '<hint>Click <body>to disable these notifications.'
      # Configure the setting display for when the setting is DISABLED (notifications are off)
      disabled:
        display-item:
          material: RED_STAINED_GLASS_PANE
          name: '<primary>Quest Progress Notifications'
          lore:
            - '<body>Status: <negative>Disabled</negative>.'
            - '<body>You will not receive chat notifications for'
            - '<body>quest objective progress milestones.'
            - ''
            - '<hint>Click <body>to enable these notifications.'
  # This GUI allows players to configure the allowlist of blocks for Remote Transfer.
  remote-transfer-gui:
    title: "<primary>Toggling Remote Transfer Items"
    previous-gui-button:
      display-item:
        name: "<primary>Back to Editing <ability>"
        material: BARRIER
        # Supports the following placeholders: <ability>
        lore:
          - '<hint>Click <body>to return to editing <primary><ability><body>.'
    # These categories should match exactly to the ones in the mining_configuration.yml.
    # The "all" category is an internal concept that acts as the combination of all configured categories.
    # If any category is defined in the mining_configuration.yml but not here, you will get errors.
    categories:
      all:
        # The name to use for the <remote-transfer-category> placeholder.
        name: "All"
        display-item:
          # The material to use for the category-button when displaying this category.
          material: ENDER_CHEST
          # Supports the following placeholders: <remote-transfer-category>
          name: "<primary>Click to change sort category."
          lore:
            - "<body>Current Category: <primary><remote-transfer-category>"
      nether:
        name: "Nether"
        display-item:
          material: MAGMA_BLOCK
          name: "<primary>Click to change sort category."
          lore:
            - "<body>Current Category: <primary><remote-transfer-category>"
      caves:
        name: "Caves"
        display-item:
          material: AMETHYST_BLOCK
          name: "<primary>Click to change sort category."
          lore:
            - "<body>Current Category: <primary><remote-transfer-category>"
      end:
        name: "End"
        display-item:
          material: ENDER_PEARL
          name: "<primary>Click to change sort category."
          lore:
            - "<body>Current Category: <primary><remote-transfer-category>"
      ocean:
        name: "Ocean"
        display-item:
          material: PRISMARINE
          name: "<primary>Click to change sort category."
          lore:
            - "<body>Current Category: <primary><remote-transfer-category>"
      ores:
        name: "Ores"
        display-item:
          material: DIAMOND_ORE
          name: "<primary>Click to change sort category."
          lore:
            - "<body>Current Category: <primary><remote-transfer-category>"
      overworld:
        name: "Overworld"
        display-item:
          material: MOSSY_COBBLESTONE
          name: "<primary>Click to change sort category."
          lore:
            - "<body>Current Category: <primary><remote-transfer-category>"
      terracotta:
        name: "Terracotta"
        display-item:
          material: TERRACOTTA
          name: "<primary>Click to change sort category."
          lore:
            - "<body>Current Category: <primary><remote-transfer-category>"
    # What button should be used to display an option for a category
    # This will be all the allowed items configured in the mining_configuration.yml
    # The display item will be the item configured over there with no edits to the name.
    category-item-option:
      # What lore to add if the option is currently enabled.
      option-enabled:
        # Supports the following placeholders: <remote-transfer-category>
        display-item:
          name: '<primary><item-type>'
          settings:
            glowing: true
          lore:
            - '<hint>Click <body>to toggle the filter state for this item.'
            - '<body>Item is currently <positive>enabled</positive>.'
            - '<body>Category: <primary><remote-transfer-category>'
      # What lore to add if the option is currently disabled.
      option-disabled:
        # Supports the following placeholders: <remote-transfer-category>
        display-item:
          name: '<primary><item-type>'
          lore:
            - '<hint>Click <body>to toggle the filter state for this item.'
            - '<body>Item is currently <negative>disabled</negative>.'
            - '<body>Category: <primary><remote-transfer-category>'
    # Configure the slot to toggle all blocks in an entire category
    toggle-entire-category-slot:
      # Configure the slot to be displayed to enable all items in the category.
      toggle-to-be-enabled:
        display-item:
          material: GREEN_STAINED_GLASS_PANE
          name: '<primary>Click to toggle all items'
          lore:
            - '<positive>Click <body>to toggle all items in the current category to be <positive>enabled</positive>.'
      # Configure the slot to be displayed to disabled all items in the category.
      toggle-to-be-disabled:
        display-item:
          material: RED_STAINED_GLASS_PANE
          name: '<primary>Click to toggle all items'
          lore:
            - '<negative>Click <body>to toggle all items in the current category to be <negative>disabled</negative>.'
  # This GUI allows players to view all of their banked special types of exp
