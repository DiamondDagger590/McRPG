#######################################
#
# Configure localization for players.

# Certain messages will contain placeholders using the
# <> format. This format is for any native placeholders supported
# by McRPG.
#
# If PAPI is enabled, then you may also use PAPI placeholders
# for messages in this file as well.
#
#######################################
#
# The locale code for this file (e.g., en, en_US, fr, de)
locale: en
# The display name for this locale (shown in the settings GUI)
locale-name: English
config-version: 1
# Configure McRPG expansions
expansion:
  # What is the display name for the McRPG content expansion?
  mcrpg: 'McRPG'
# Configure messages for player login
login:
  # The message to send a player whenever there is an issue loading their McRPG data.
  unable-to-load-data: "<negative>There was an issue loading your McRPG data, logging back into the server may fix this issue. If that does not fix the issue, please contact a server admin!"
# Configure messages and localization related to experience things
experience:
  # Configure messages related to the rested experience feature
  rested-experience:
    # The message to send to a player whenever they reach the maximum amount of rested experience they can accumulate.
    maximum-rested-experience-reached: '<body>You currently have reached your limit of how much rested experience. Gain experience with McRPG to use it to level up faster!'
    # The message to send via action bar to a player whenever they enter an area that's registered as an McRPG safe zone and online accumulation is allowed.
    entering-safe-zone-online-accumulation: '<body>You have entered a rest zone, you will now begin gaining rested experience.'
    # The message to send via action bar to a player whenever they leave an area that's registered as an McRPG safe zone and online accumulation is allowed.
    leaving-safe-zone-online-accumulation: '<body>You have left a rest zone, you will no longer be gaining rested experience.'
    # The message to send via action bar to a player whenever they enter an area that's registered as an McRPG safe zone and offline accumulation is allowed.
    entering-safe-zone-offline-accumulation: '<body>You have entered a rest zone, you will now begin gaining rested experience.'
    # The message to send via action bar to a player whenever they leave an area that's registered as an McRPG safe zone and offline accumulation is allowed.
    leaving-safe-zone-offline-accumulation: '<body>You have left a rest zone, you will no longer be gaining rested experience.'
    # The message to send to a player whenever they log in and have gained rested experience whilst they were offline.
    offline-rested-experience-awarded: '<body>You have gained <primary><rested-experience-gained> levels</primary> worth of rested experience while offline. Gain experience with McRPG to use it to level up faster!'
  # Configure experience display localization
  experience-display:
    # The message to send to a player's action bar whenever they gain experience.
    # Valid placeholders are <skill>, <level>, <current-experience>, <required-experience-to-level-up> and <remaining-experience-to-level-up>
    action-bar-display-message: "<skill> <body>Lv. <primary><level> <body>- Remaining Exp <primary><remaining-experience-to-level-up>"
    # The message to send to display as the boss bar's name when sent to a player.
    # Valid placeholders are <skill>, <level>, <current-experience>, <required-experience-to-level-up> and <remaining-experience-to-level-up>
    boss-bar-display-message: "<skill> <body>Lv. <primary><level> <body>- Remaining Exp <primary><remaining-experience-to-level-up>"
# Configure combat log and display messages
combat:
  combat-log:
    # The message broadcast to every online player and the console when a player combat logs.
    # Valid placeholders are <player>, <world>, <x>, <y> and <z>
    broadcast: "<warning><player> <body>combat logged at <primary><world> <x>, <y>, <z>"
  # The action bar message shown when a player's combat session ends naturally (timeout or all
  # participants gone) and the server's combat log mode would have punished a logout.
  exit-message: "<positive>You are no longer in combat."
