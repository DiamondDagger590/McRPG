# Daily mining quests for the quest board.

quests:
  # -------------------------------------------------------------------
  # Simple: Mine a stack of stone
  # -------------------------------------------------------------------
  mcrpg:daily_stone_haul:
    display:
      name: "Stone Haul"
      description: "Mine a stack of various stone types"
      objectives:
        daily_break_stone: "Mine stone blocks"
      rewards:
        mining_xp: "<amount> <skill> XP"
    scope: mcrpg:single_player
    expiration: 24h
    board-metadata:
      board-eligible: true
      supported-rarities:
        - mcrpg:common
        - mcrpg:uncommon
      supported-refresh-types:
        - DAILY
    rewards:
      mining_xp:
        type: mcrpg:experience
        skill: MINING
        amount: 1000
    phases:
      dig:
        completion-mode: ALL
        stages:
          mine_stone:
            key: mcrpg:daily_mine_stone
            objectives:
              break_stone:
                key: mcrpg:daily_break_stone
                type: mcrpg:block_break
                required-progress: 64
                config:
                  blocks:
                    - STONE
                    - COBBLESTONE
                    - ANDESITE
                    - DIORITE
                    - GRANITE

  # -------------------------------------------------------------------
  # Medium: Mine deepslate
  # -------------------------------------------------------------------
  mcrpg:daily_deepslate_delver:
    display:
      name: "Deepslate Delver"
      description: "Mine deepslate deep underground"
      objectives:
        daily_break_deepslate: "Mine deepslate blocks"
      rewards:
        mining_xp: "<amount> <skill> XP"
    scope: mcrpg:single_player
    expiration: 24h
    board-metadata:
      board-eligible: true
      supported-rarities:
        - mcrpg:uncommon
        - mcrpg:rare
      supported-refresh-types:
        - DAILY
    rewards:
      mining_xp:
        type: mcrpg:experience
        skill: MINING
        amount: 2000
    phases:
      delve:
        completion-mode: ALL
        stages:
          mine_deepslate:
            key: mcrpg:daily_mine_deepslate
            objectives:
              break_deepslate:
                key: mcrpg:daily_break_deepslate
                type: mcrpg:block_break
                required-progress: 128
                config:
                  blocks:
                    - DEEPSLATE
                    - COBBLED_DEEPSLATE

  # -------------------------------------------------------------------
  # Hard: Mine precious ores
  # -------------------------------------------------------------------
  mcrpg:daily_ore_rush:
    display:
      name: "Ore Rush"
      description: "Mine precious gold and diamond ores"
      objectives:
        daily_break_gold: "Mine gold ore"
        daily_break_diamond: "Mine diamond ore"
      rewards:
        mining_xp: "<amount> <skill> XP"
        gem_bonus: "<amount>x <material>"
    scope: mcrpg:single_player
    expiration: 24h
    board-metadata:
      board-eligible: true
      supported-rarities:
        - mcrpg:rare
        - mcrpg:epic
      supported-refresh-types:
        - DAILY
    rewards:
      mining_xp:
        type: mcrpg:experience
        skill: MINING
        amount: 5000
      gem_bonus:
        type: mcrpg:item
        item:
          material: DIAMOND
        amount: 2
    phases:
      mine_ores:
        completion-mode: ALL
        stages:
          mine_precious:
            key: mcrpg:daily_mine_precious
            objectives:
              break_gold:
                key: mcrpg:daily_break_gold
                type: mcrpg:block_break
                required-progress: 12
                config:
                  blocks:
                    - GOLD_ORE
                    - DEEPSLATE_GOLD_ORE
              break_diamond:
                key: mcrpg:daily_break_diamond
                type: mcrpg:block_break
                required-progress: 6
                config:
                  blocks:
                    - DIAMOND_ORE
                    - DEEPSLATE_DIAMOND_ORE

  # -------------------------------------------------------------------
  # Simple: Mine copper ore
  # -------------------------------------------------------------------
  mcrpg:daily_copper_collector:
    display:
      name: "Copper Collector"
      description: "Collect copper ore from the mines"
      objectives:
        daily_break_copper: "Mine copper ore"
      rewards:
        mining_xp: "<amount> <skill> XP"
    scope: mcrpg:single_player
    expiration: 24h
    board-metadata:
      board-eligible: true
      supported-rarities:
        - mcrpg:common
      supported-refresh-types:
        - DAILY
    rewards:
      mining_xp:
        type: mcrpg:experience
        skill: MINING
        amount: 1000
    phases:
      dig:
        completion-mode: ALL
        stages:
          mine_copper:
            key: mcrpg:daily_mine_copper
            objectives:
              break_copper:
                key: mcrpg:daily_break_copper
                type: mcrpg:block_break
                required-progress: 32
                config:
                  blocks:
                    - COPPER_ORE
                    - DEEPSLATE_COPPER_ORE
