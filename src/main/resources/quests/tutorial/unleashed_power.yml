quests:
  mcrpg:tutorial_active_unlock:
    scope: mcrpg:single_player
    repeat-mode: once
    display:
      name: "<tutorial>Unleashed Power"
    on-start-messages:
      explain:
        key: tutorial.quests.unleashed-power.on-start
    phases:
      phase_1:
        completion-mode: ALL
        stages:
          stage_1:
            key: mcrpg:tutorial_active_unlock_stage_1
            objectives:
              unlock_active:
                key: mcrpg:tutorial_active_unlock_obj
                type: mcrpg:ability_unlock
                required-progress: 1
                config:
                  ability-type: ACTIVE
    rewards:
      boosted_xp:
        type: mcrpg:boosted_experience
        amount: 2000
      redeemable_level:
        type: mcrpg:redeemable_levels
        amount: 1
