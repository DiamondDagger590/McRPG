config-version: 3

# Combat stat base values. These define the starting pools for all players.
stats:
  health:
    # Maximum custom HP displayed in the action bar. Vanilla hearts show a percentage of this value.
    base-max: 200
  mana:
    # Maximum mana pool. Combo abilities consume mana on activation.
    base-max: 220
    # Passive mana regeneration rate (mana points restored per second).
    regen-per-second: 5

# HUD / action bar display settings moved to hud_configuration.yml.

combo:
  # Items that are allowed to register combo inputs. An empty hand always counts regardless of this list,
  # but note that right-clicking air with empty hands does not produce a server event (Minecraft client
  # limitation), so empty-hand combos only work when looking at a block or entity.
  # Each entry is a Material name (e.g. DIAMOND_SWORD) or a custom item key for custom items.
  # This list is reloaded live via /mcrpg admin reload — no restart required.
  allowed-items:
    - WOODEN_SWORD
    - STONE_SWORD
    - IRON_SWORD
    - GOLDEN_SWORD
    - DIAMOND_SWORD
    - NETHERITE_SWORD
    - WOODEN_AXE
    - STONE_AXE
    - IRON_AXE
    - GOLDEN_AXE
    - DIAMOND_AXE
    - NETHERITE_AXE
    - WOODEN_PICKAXE
    - STONE_PICKAXE
    - IRON_PICKAXE
    - GOLDEN_PICKAXE
    - DIAMOND_PICKAXE
    - NETHERITE_PICKAXE
    - WOODEN_SHOVEL
    - STONE_SHOVEL
    - IRON_SHOVEL
    - GOLDEN_SHOVEL
    - DIAMOND_SHOVEL
    - NETHERITE_SHOVEL
    - WOODEN_HOE
    - STONE_HOE
    - IRON_HOE
    - GOLDEN_HOE
    - DIAMOND_HOE
    - NETHERITE_HOE
    - WOODEN_SPEAR
    - STONE_SPEAR
    - COPPER_SPEAR
    - IRON_SPEAR
    - GOLDEN_SPEAR
    - DIAMOND_SPEAR
    - NETHERITE_SPEAR
    - BOW
    - CROSSBOW
    - TRIDENT
    - MACE

  timing:
    # How many server ticks to wait for the next input before resetting the combo sequence.
    # 14 ticks ≈ 700 ms at 20 TPS.
    window-ticks: 30

  failure-feedback:
    # Sound played when a combo fails (insufficient mana or cooldown).
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.5

  abilities:
    shockwave:
      # Mana cost to activate this ability via combo.
      mana-cost: 30
      # Radius in blocks within which entities are knocked back.
      radius: 6.0
      # Velocity multiplier applied outward from the player to each nearby entity.
      knockback-force: 2.5

    cleave:
      # Mana cost to activate this ability via combo.
      mana-cost: 20
      # Radius in blocks within which entities are damaged.
      radius: 3.0
      # Raw damage dealt to each entity within range (respects armor and enchantments).
      damage: 4.0

    rage-spike:
      # Mana cost to activate this ability via combo.
      mana-cost: 25

    ore-scanner:
      # Mana cost to activate this ability via combo.
      mana-cost: 40

    mass-harvest:
      # Mana cost to activate this ability via combo.
      mana-cost: 40
